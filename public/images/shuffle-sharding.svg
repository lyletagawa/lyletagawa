<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="500" fill="#FFFFFF"/>

  <!-- Axes -->
  <line x1="120" y1="400" x2="720" y2="400" stroke="#445566" stroke-width="2"/>
  <line x1="120" y1="400" x2="120" y2="60" stroke="#445566" stroke-width="2"/>

  <!-- Y gridlines at 0%, 25%, 50%, 75%, 100% -->
  <line x1="120" y1="400" x2="720" y2="400" stroke="#DDEEEE" stroke-width="1"/>
  <line x1="120" y1="315" x2="720" y2="315" stroke="#DDEEEE" stroke-width="1"/>
  <line x1="120" y1="230" x2="720" y2="230" stroke="#DDEEEE" stroke-width="1"/>
  <line x1="120" y1="145" x2="720" y2="145" stroke="#DDEEEE" stroke-width="1"/>
  <line x1="120" y1="60" x2="720" y2="60" stroke="#DDEEEE" stroke-width="1"/>

  <!-- Y tick labels -->
  <text x="105" y="404" font-family="'SF Mono', 'Fira Code', monospace" font-size="13" fill="#445566" text-anchor="end">0%</text>
  <text x="105" y="319" font-family="'SF Mono', 'Fira Code', monospace" font-size="13" fill="#445566" text-anchor="end">25%</text>
  <text x="105" y="234" font-family="'SF Mono', 'Fira Code', monospace" font-size="13" fill="#445566" text-anchor="end">50%</text>
  <text x="105" y="149" font-family="'SF Mono', 'Fira Code', monospace" font-size="13" fill="#445566" text-anchor="end">75%</text>
  <text x="105" y="64" font-family="'SF Mono', 'Fira Code', monospace" font-size="13" fill="#445566" text-anchor="end">100%</text>

  <!-- Bar 0: 99.22% -->
  <rect x="140" y="62.65" width="80" height="337.35" fill="#FF9900"/>
  <text x="180" y="48" font-family="'SF Mono', 'Fira Code', monospace" font-size="15" fill="#663333" text-anchor="middle">99.2205%</text>

  <!-- Bar 1: 0.78%, a thin sliver -->
  <rect x="260" y="397.35" width="80" height="2.65" fill="#FF9900"/>
  <text x="300" y="390" font-family="'SF Mono', 'Fira Code', monospace" font-size="14" fill="#663333" text-anchor="middle">0.7778%</text>

  <!-- Bars 2-4: too small to render, marked at baseline with leader lines to labels -->
  <circle cx="420" cy="400" r="2.5" fill="#FF9900"/>
  <text x="420" y="390" font-family="'SF Mono', 'Fira Code', monospace" font-size="13" fill="#663333" text-anchor="middle">0.0017%</text>

  <circle cx="540" cy="400" r="2.5" fill="#FF9900"/>
  <text x="540" y="390" font-family="'SF Mono', 'Fira Code', monospace" font-size="13" fill="#663333" text-anchor="middle">0.0000011%</text>

  <circle cx="660" cy="400" r="2.5" fill="#FF9900"/>
  <text x="660" y="390" font-family="'SF Mono', 'Fira Code', monospace" font-size="13" fill="#663333" text-anchor="middle">0.00000000014%</text>

  <!-- X tick labels -->
  <text x="180" y="424" font-family="'SF Mono', 'Fira Code', monospace" font-size="13" fill="#445566" text-anchor="middle">0</text>
  <text x="300" y="424" font-family="'SF Mono', 'Fira Code', monospace" font-size="13" fill="#445566" text-anchor="middle">1</text>
  <text x="420" y="424" font-family="'SF Mono', 'Fira Code', monospace" font-size="13" fill="#445566" text-anchor="middle">2</text>
  <text x="540" y="424" font-family="'SF Mono', 'Fira Code', monospace" font-size="13" fill="#445566" text-anchor="middle">3</text>
  <text x="660" y="424" font-family="'SF Mono', 'Fira Code', monospace" font-size="13" fill="#445566" text-anchor="middle">4</text>

  <!-- Axis titles -->
  <text x="420" y="458" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#99AABB" font-weight="500" text-anchor="middle" letter-spacing="2">NAME SERVERS SHARED WITH ANOTHER CUSTOMER</text>
  <text x="40" y="230" transform="rotate(-90 40 230)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#99AABB" font-weight="500" text-anchor="middle" letter-spacing="2">% OF CUSTOMER PAIRS</text>

  <!-- Caption note -->
  <text x="420" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#667788" text-anchor="middle">2,048 virtual name servers, shard size 4</text>
</svg>
